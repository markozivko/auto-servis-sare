<!doctype html>
<html lang="hr">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Šare — provjera hrvatske i engleske stranice</title>
  <style>
    body {
      margin: 24px;
      font: 14px system-ui;
      background: #d9ddd6;
      color: #172018;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin: 18px 0;
      flex-wrap: wrap;
    }
    button,
    select {
      padding: 12px 18px;
      font: inherit;
      cursor: pointer;
    }
    button:disabled,
    select:disabled {
      cursor: wait;
    }
    iframe {
      border: 0;
      background: #fff;
      height: 850px;
      display: block;
      box-shadow: 0 8px 40px #0002;
    }
    pre {
      white-space: pre-wrap;
      line-height: 1.7;
    }
  </style>
  <h1>Lokalna provjera oba jezika</h1>
  <p>
    Stvarna stranica unutar mobilne, tabletne ili desktop širine. Testni podaci
    ne šalju se servisu; alat ne otvara e-mail aplikaciju niti mijenja
    međuspremnik.
  </p>
  <div class="toolbar">
    <label for="language">Jezik pregleda</label>
    <select id="language">
      <option value="hr">HR — Hrvatski</option>
      <option value="en">EN — English</option>
    </select>
    <button id="check-all">Provjeri oba jezika, obrasce i vodič</button>
    <button id="check-form">Provjeri trenutačni obrazac i vodič</button>
    <button data-width="320">320 px</button>
    <button data-width="390">390 px</button>
    <button data-width="768">768 px</button>
    <button data-width="1440">1440 px</button>
  </div>
  <p id="status" role="status">Učitavanje hrvatske stranice…</p>
  <details>
    <summary>Detaljni rezultati po jezicima</summary>
    <pre id="results" aria-label="Rezultati provjere po jezicima"></pre>
  </details>
  <iframe
    id="preview"
    title="Pregled stranice Šare na hrvatskom ili engleskom"
    style="width: 390px"
  ></iframe>
  <script>
    const preview = document.querySelector("#preview");
    const output = document.querySelector("#results");
    const status = document.querySelector("#status");
    const language = document.querySelector("#language");
    const pages = { hr: "index.html", en: "en/index.html" };
    const labels = { hr: "HR — Hrvatski", en: "EN — English" };
    const results = { hr: [], en: [] };
    const widths = [320, 375, 390, 768, 1000, 1024, 1440, 1920];
    const serviceValues = [
      "mechanics",
      "diagnostics",
      "electrics",
      "tyres",
      "air-conditioning",
      "inspection",
      "other",
    ];
    let busy = false;
    const frameReady = () => new Promise((resolve) => setTimeout(resolve, 100));

    preview.addEventListener("load", () => {
      const lang = preview.contentDocument?.documentElement.lang;
      if (pages[lang]) language.value = lang;
    });

    function renderResults() {
      output.textContent = Object.keys(pages)
        .map(
          (lang) =>
            labels[lang] +
            "\n" +
            (results[lang].join("\n") || "Još nije provjereno."),
        )
        .join("\n\n");
    }

    function record(lang, pass, description) {
      results[lang].push(`${pass ? "PASS" : "FAIL"} ${description}`);
      renderResults();
    }

    async function runChecks(action) {
      if (busy) return;
      busy = true;
      document
        .querySelectorAll(".toolbar button, .toolbar select")
        .forEach((control) => {
          control.disabled = true;
        });
      try {
        await action();
        const summary = Object.keys(pages).map((lang) => {
          const passes = results[lang].filter((line) =>
            line.startsWith("PASS"),
          ).length;
          const failures = results[lang].filter((line) =>
            line.startsWith("FAIL"),
          );
          return (
            `${lang.toUpperCase()}: ${passes} PASS, ${failures.length} FAIL` +
            (failures.length ? ` (${failures.join("; ")})` : "")
          );
        });
        status.textContent = "Provjera je završena. " + summary.join(" · ");
      } catch (error) {
        status.textContent =
          "Provjera se nije mogla dovršiti: " + error.message;
      } finally {
        busy = false;
        document
          .querySelectorAll(".toolbar button, .toolbar select")
          .forEach((control) => {
            control.disabled = false;
          });
      }
    }

    async function loadPage(lang) {
      language.value = lang;
      status.textContent = "Učitavanje: " + labels[lang];
      await new Promise((resolve, reject) => {
        const timeout = setTimeout(() => {
          preview.onload = null;
          reject(
            new Error(
              "Učitavanje traje predugo. Provjerite lokalni poslužitelj.",
            ),
          );
        }, 20000);
        preview.onload = () => {
          clearTimeout(timeout);
          preview.onload = null;
          resolve();
        };
        preview.src = pages[lang];
      });
      const doc = preview.contentDocument;
      if (!doc.querySelector("#booking-form")) {
        throw new Error("Stranica nije dostupna: " + pages[lang]);
      }
      await doc.fonts.ready;
      return doc;
    }

    async function checkResponsive(lang, doc) {
      status.textContent = "Provjera prikaza: " + labels[lang];
      record(
        lang,
        doc.documentElement.lang === lang,
        "oznaka jezika dokumenta",
      );
      for (const width of widths) {
        preview.style.width = width + "px";
        await frameReady();
        const actual = doc.documentElement.clientWidth;
        const overflow = doc.documentElement.scrollWidth > actual;
        const outside = [...doc.querySelectorAll("main *, header *, footer *")]
          .filter((el) => {
            const r = el.getBoundingClientRect();
            return (
              r.width &&
              (r.right > actual + 1 || r.left < -1) &&
              preview.contentWindow.getComputedStyle(el).position !== "absolute"
            );
          })
          .map((el) => el.tagName + "." + el.className)
          .slice(0, 6);
        record(
          lang,
          !overflow,
          `${width}px bez horizontalnog prelijevanja` +
            (outside.length ? " | pregledati: " + outside.join(", ") : ""),
        );
      }
      const images = [...doc.images];
      // Explicit loading also checks images outside the iframe's lazy-load area.
      images.forEach((img) => {
        img.loading = "eager";
      });
      await Promise.all(images.map((img) => img.decode().catch(() => {})));
      record(
        lang,
        images.every((img) => img.complete && img.naturalWidth),
        "sve slike učitane",
      );
      record(
        lang,
        doc.fonts.check('700 16px "Barlow Condensed"') &&
          doc.fonts.check("400 16px Manrope"),
        "lokalni fontovi učitani",
      );
      preview.style.width = "390px";
      preview.contentWindow.scrollTo(0, 0);
    }

    function checkForm(lang, doc) {
      status.textContent = "Provjera obrasca: " + labels[lang];
      const form = doc.querySelector("#booking-form");
      const dialog = doc.querySelector("#booking-dialog");
      const result = doc.querySelector("#booking-result");
      const field = (name) => form.elements.namedItem(name);
      const message =
        "Molim provjeru vozila: čćžšđ & upit?\nPlease retain my original wording.";
      const requiredLanguage =
        lang === "hr"
          ? /unesite|odaberite|opišite/i
          : /please|enter|select|choose|describe/i;
      const invalidEmailLanguage =
        lang === "hr" ? /ispravn.*e.?mail|valjan.*e.?mail/i : /valid.*e.?mail/i;
      const subjectLanguage =
        lang === "hr"
          ? /upit za servis/i
          : /(?:service|repair).*(?:enquiry|inquiry)|(?:enquiry|inquiry).*service/i;
      const bodyLanguage = lang === "hr" ? /poštovani/i : /dear|hello/i;
      const set = (name, value) => {
        field(name).value = value;
        field(name).dispatchEvent(
          new preview.contentWindow.Event("input", { bubbles: true }),
        );
      };
      const fill = () => {
        set("name", "  Test Korisnik  ");
        set("email", "\u00a0test@example.com\u00a0");
        set("phone", "+385 99 123 4567");
        set("vehicle", "Opel Astra");
        set("message", message);
      };
      const edit = () => doc.querySelector("#edit-inquiry").click();
      try {
        doc.querySelector("[data-booking]").click();
        form.reset();
        [...form.elements].forEach((el) => el.setCustomValidity?.(""));
        form.requestSubmit();
        for (const name of ["name", "email", "service", "message"]) {
          record(
            lang,
            !field(name).validity.valid &&
              requiredLanguage.test(field(name).validationMessage),
            `obavezno polje ${name}: poruka na odabranom jeziku`,
          );
        }
        fill();
        set("service", "mechanics");
        set("email", "nije-adresa");
        form.requestSubmit();
        record(
          lang,
          !form.hidden &&
            result.hidden &&
            !field("email").validity.valid &&
            invalidEmailLanguage.test(field("email").validationMessage),
          "neispravna e-mail adresa odbijena uz prevedenu poruku",
        );

        for (const service of serviceValues) {
          const trigger = doc.querySelector(
            `[data-booking][data-service="${service}"]`,
          );
          if (!trigger) {
            record(lang, false, "nedostaje odabir usluge: " + service);
            continue;
          }
          trigger.click();
          record(
            lang,
            field("service").value === service,
            "odabir usluge: " + service,
          );
          fill();
          const serviceLabel = field("service")
            .selectedOptions[0].textContent.trim()
            .replace(/\s+/g, " ");
          form.requestSubmit();
          const href =
            doc.querySelector("#email-draft").getAttribute("href") || "";
          const query = new URLSearchParams(href.split("?")[1] || "");
          const body = query.get("body") || "";
          const subject = query.get("subject") || "";
          record(
            lang,
            form.hidden &&
              !result.hidden &&
              href.startsWith("mailto:auto-servis@opel-sare.hr?") &&
              subjectLanguage.test(subject) &&
              bodyLanguage.test(body) &&
              subject.includes(serviceLabel) &&
              body.includes(serviceLabel) &&
              subject.includes("Opel Astra") &&
              body.includes(message) &&
              body.includes("test@example.com") &&
              body.includes("+385 99 123 4567") &&
              body === doc.querySelector("#inquiry-preview").value &&
              field("name").value === "Test Korisnik",
            "prevedeni predmet i nacrt, izvorni unos i primatelj: " + service,
          );
          edit();
        }
        record(
          lang,
          !form.hidden &&
            result.hidden &&
            field("vehicle").value === "Opel Astra" &&
            field("message").value === message,
          "uređivanje nacrta zadržava unesene podatke",
        );
        set("message", "   ");
        form.requestSubmit();
        record(
          lang,
          !form.hidden &&
            result.hidden &&
            !field("message").validity.valid &&
            requiredLanguage.test(field("message").validationMessage),
          "prazna poruka odbijena i nakon uređivanja nacrta",
        );
      } finally {
        form.reset();
        [...form.elements].forEach((el) => el.setCustomValidity?.(""));
        dialog.close();
        preview.contentWindow.scrollTo(0, 0);
      }
    }

    async function checkGuide(lang, doc) {
      status.textContent = "Provjera vodiča: " + labels[lang];
      const guide = doc.querySelector("#vodic");
      const choices = doc.querySelector("#guide-choices");
      const details = doc.querySelector("#guide-details");
      const guideForm = doc.querySelector("#guide-form");
      const guidePreview = doc.querySelector("#guide-preview");
      const summary = doc.querySelector("#guide-summary");
      const back = doc.querySelector("#guide-back");
      const booking = doc.querySelector("#booking-form");
      const dialog = doc.querySelector("#booking-dialog");
      const result = doc.querySelector("#booking-result");
      const field = (name) => booking.elements.namedItem(name);
      const scenarios = {
        climate: [
          "air-conditioning",
          lang === "hr" ? /klim/i : /air.?conditioning|cool/i,
        ],
        inspection: [
          "inspection",
          lang === "hr" ? /tehnič/i : /roadworthiness|inspect/i,
        ],
        maintenance: [
          "mechanics",
          lang === "hr" ? /servis/i : /servic|maintenance/i,
        ],
        unsure: [
          "other",
          lang === "hr" ? /sigur|pomoć|provjer/i : /sure|help|check/i,
        ],
      };
      const set = (name, value) => {
        field(name).value = value;
        field(name).dispatchEvent(
          new preview.contentWindow.Event("input", { bubbles: true }),
        );
      };
      const choose = (situation) => {
        if (choices.hidden) back.click();
        const button = doc.querySelector(
          `[data-guide-situation="${situation}"]`,
        );
        button.click();
        return button;
      };
      const answer = (value = "0") => {
        doc.querySelector(`#guide-answers input[value="${value}"]`).click();
        return summary.textContent.trim();
      };
      const reset = () => {
        if (!result.hidden) doc.querySelector("#edit-inquiry").click();
        dialog.close();
        booking.reset();
        [...booking.elements].forEach((el) => el.setCustomValidity?.(""));
        if (choices.hidden) back.click();
      };
      const occurrences = (text, part) => text.split(part).length - 1;
      const originalWidth = preview.style.width;

      record(
        lang,
        Boolean(guide && !guide.hidden && guideForm && choices && details),
        "vodič dostupan nakon učitavanja JavaScripta",
      );
      if (!guide || !guideForm || !choices || !details) return;

      try {
        reset();
        const firstChoice = choose("climate");
        record(
          lang,
          choices.hidden &&
            !details.hidden &&
            doc.activeElement === doc.querySelector("#guide-question"),
          "odabir situacije otvara pitanje i premješta fokus",
        );
        guideForm.requestSubmit();
        record(
          lang,
          !guideForm.checkValidity() &&
            !dialog.open &&
            guidePreview.hidden &&
            field("message").value === "",
          "vodič zahtijeva odgovor prije prijenosa u obrazac",
        );
        answer();
        back.click();
        record(
          lang,
          !choices.hidden &&
            details.hidden &&
            doc.activeElement === firstChoice,
          "povratak na situacije vraća fokus na odabranu karticu",
        );
        choose("climate");
        record(
          lang,
          !doc.querySelector("#guide-answers input:checked") &&
            guidePreview.hidden,
          "novi odabir situacije briše prethodni odgovor i sažetak",
        );

        for (const [situation, [service, translated]] of Object.entries(
          scenarios,
        )) {
          reset();
          choose(situation);
          const values = [
            ...doc.querySelectorAll('#guide-answers input[type="radio"]'),
          ].map((input) => input.value);
          record(lang, values.length > 1, `vodič nudi odgovore: ${situation}`);
          for (const value of values) {
            reset();
            choose(situation);
            const text = answer(value);
            guideForm.requestSubmit();
            record(
              lang,
              text.length > 0 &&
                translated.test(text) &&
                !guidePreview.hidden &&
                dialog.open &&
                !booking.hidden &&
                result.hidden &&
                field("service").value === service &&
                field("message").value === text,
              `vodič prenosi prevedeni sažetak i uslugu: ${situation}, odgovor ${value}`,
            );
          }
        }

        reset();
        const existing = {
          name: "Test Korisnik",
          email: "test@example.com",
          phone: "+385 99 123 4567",
          vehicle: "Opel Astra",
        };
        Object.entries(existing).forEach(([name, value]) => set(name, value));
        const manual =
          "Moj postojeći opis: čćžšđ.\nPlease preserve these details.";
        set("message", manual);
        set("service", "diagnostics");
        field("service").setCustomValidity("Stara testna pogreška");
        field("message").setCustomValidity("Stara testna pogreška");
        choose("climate");
        const firstSummary = answer();
        guideForm.requestSubmit();
        const firstMessage = field("message").value;
        record(
          lang,
          dialog.open &&
            Object.entries(existing).every(
              ([name, value]) => field(name).value === value,
            ) &&
            firstMessage.includes(manual) &&
            occurrences(firstMessage, firstSummary) === 1 &&
            !field("service").validity.customError &&
            !field("message").validity.customError,
          "vodič čuva kontakt, vozilo i vlastiti opis te uklanja stare pogreške prenesenih polja",
        );
        dialog.close();
        guideForm.requestSubmit();
        record(
          lang,
          dialog.open && field("message").value === firstMessage,
          "ponovljeni prijenos istog odgovora ne duplicira sažetak",
        );
        dialog.close();
        choose("inspection");
        const secondSummary = answer();
        guideForm.requestSubmit();
        record(
          lang,
          field("message").value.includes(manual) &&
            !field("message").value.includes(firstSummary) &&
            occurrences(field("message").value, secondSummary) === 1 &&
            field("service").value === "inspection",
          "promjena situacije zamjenjuje prethodni sažetak i čuva vlastiti opis",
        );

        const middle = Math.floor(secondSummary.length / 2);
        const editedSummary =
          secondSummary.slice(0, middle) +
          " [moj dodatak] " +
          secondSummary.slice(middle);
        const editedMessage = field("message").value.replace(
          secondSummary,
          editedSummary,
        );
        set("message", editedMessage);
        dialog.close();
        choose("maintenance");
        answer();
        guideForm.requestSubmit();
        const reuse = doc.querySelector("#guide-reuse");
        record(
          lang,
          !dialog.open &&
            field("message").value === editedMessage &&
            field("service").value === "inspection" &&
            !reuse.hidden &&
            doc.activeElement === doc.querySelector("#guide-reuse-title"),
          "izmijenjeni prethodni sažetak traži odluku bez promjene upita",
        );
        reuse.querySelector('[value="keep"]').click();
        guideForm.requestSubmit();
        record(
          lang,
          dialog.open &&
            field("message").value === editedMessage &&
            field("service").value === "mechanics",
          "odabir zadržavanja čuva točan postojeći opis bez dodavanja drugog sažetka",
        );
        booking.requestSubmit();
        record(
          lang,
          booking.hidden && !result.hidden,
          "upit iz vodiča može pripremiti nacrt",
        );
        dialog.close();
        guideForm.requestSubmit();
        record(
          lang,
          dialog.open && !booking.hidden && result.hidden,
          "ponovni prijenos iz vodiča nakon nacrta vraća obrazac za uređivanje",
        );

        reset();
        set("message", manual);
        choose("climate");
        const originalSummary = answer();
        guideForm.requestSubmit();
        set(
          "message",
          manual + "\n\n" + originalSummary.replace(".", " (moj dodatak)."),
        );
        dialog.close();
        choose("inspection");
        const replacement = answer();
        guideForm.requestSubmit();
        reuse.querySelector('[value="replace"]').click();
        guideForm.requestSubmit();
        record(
          lang,
          dialog.open &&
            field("message").value === replacement &&
            field("service").value === "inspection",
          "izričit odabir zamjene koristi samo novi sažetak",
        );

        reset();
        const limit = field("message").maxLength;
        const longMessage = "x".repeat(Math.max(limit, 1));
        set("message", longMessage);
        set("service", "tyres");
        choose("unsure");
        answer();
        guideForm.requestSubmit();
        const error = doc.querySelector("#guide-error");
        record(
          lang,
          limit > 0 &&
            !dialog.open &&
            field("message").value === longMessage &&
            field("service").value === "tyres" &&
            error &&
            !error.hidden &&
            error.textContent.trim().length > 0,
          "predugačak ukupni opis zaustavlja prijenos bez djelomičnih izmjena",
        );

        reset();
        for (const situation of Object.keys(scenarios)) {
          choose(situation);
          const inputs = [
            ...doc.querySelectorAll('#guide-answers input[type="radio"]'),
          ];
          answer(inputs[inputs.length - 1].value);
          for (const width of [320, 390, 768, 1440]) {
            preview.style.width = width + "px";
            await frameReady();
            const actual = doc.documentElement.clientWidth;
            const withinViewport = [...details.querySelectorAll("*")].every(
              (el) => {
                const bounds = el.getBoundingClientRect();
                return (
                  !bounds.width ||
                  (bounds.left >= -1 && bounds.right <= actual + 1)
                );
              },
            );
            record(
              lang,
              doc.documentElement.scrollWidth <= actual && withinViewport,
              `vodič s odgovorom bez prelijevanja: ${situation}, ${width}px`,
            );
          }
        }
      } finally {
        reset();
        preview.style.width = originalWidth;
        preview.contentWindow.scrollTo(0, 0);
      }
    }

    language.addEventListener("change", () =>
      runChecks(async () => {
        const lang = language.value;
        const doc = await loadPage(lang);
        results[lang] = [];
        await checkResponsive(lang, doc);
      }),
    );
    document.querySelector("#check-all").addEventListener("click", () =>
      runChecks(async () => {
        for (const lang of Object.keys(pages)) {
          results[lang] = [];
          const doc = await loadPage(lang);
          await checkResponsive(lang, doc);
          checkForm(lang, doc);
          await checkGuide(lang, doc);
        }
      }),
    );
    document.querySelector("#check-form").addEventListener("click", () =>
      runChecks(async () => {
        checkForm(language.value, preview.contentDocument);
        await checkGuide(language.value, preview.contentDocument);
      }),
    );
    document.querySelectorAll("[data-width]").forEach((button) => {
      button.addEventListener("click", () => {
        preview.style.width = button.dataset.width + "px";
      });
    });
    renderResults();
    runChecks(async () => {
      const doc = await loadPage("hr");
      await checkResponsive("hr", doc);
    });
  </script>
</html>
